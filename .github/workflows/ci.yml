name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    name: macOS
    runs-on: macos-26   # default Xcode 26.x (Swift 6.2+), the minimum toolchain
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: swift --version
      - run: swift build --build-tests
      - name: swift test
        shell: bash
        run: set -o pipefail && swift test 2>&1 | tee test.log
      - name: Surface failures as annotations
        if: failure()
        shell: bash
        run: ./.github/scripts/annotate-failures.sh test.log

  linux:
    name: Linux (swift:${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.4"]   # the minimum and the newest official image
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build --build-tests
      - name: swift test
        shell: bash
        run: set -o pipefail && swift test 2>&1 | tee test.log
      - name: Surface failures as annotations
        if: failure()
        shell: bash
        run: ./.github/scripts/annotate-failures.sh test.log
