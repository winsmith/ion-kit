name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    name: macOS (Xcode 26)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
      - run: swift --version
      - run: swift build --build-tests
      - run: swift test

  linux:
    name: Linux (swift:6.2)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build --build-tests
      - run: swift test
